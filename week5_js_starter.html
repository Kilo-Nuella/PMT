// TASK 4: write function grade(avg) returning "A" (>=16), "B" (>=14), "C" (>=12), "D" (>=10) or "F"
//         print grade(15), grade(9.99), grade(16)
function grade(avg){
  if (avg >= 16) return "A";
  if (avg >= 14) return "B";
  if (avg >= 12) return "C";
  if (avg >= 10) return "D";
  else return "F";
 }
 console.log(grade(15) + " " + grade(9.99) + " " + grade(16));

  count++;

// TASK 6c: write function findByCode(list, code) that returns the class object, or null
//          print findByCode(classes, "SWE 241").room  and  findByCode(classes, "SWE 999")

function findByCode(list,code){
  for( const c in list){
    if(c.code === code)
    return c;
  }
  return null;
}
console.log(findByCode(classes, "SWE 241").room);
console.log(findByCode(classes, "SWE 999"));

let total = 0;
for(const c of classes){
  total =+ c.end - c.start;
}
console.log("Total: " + total + " hours");
